[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "payment-gateways"
version = "0.1.0"
description = "Payment provider abstraction with auditable hold, capture, refund, cancel and status operations."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Shipmind Labs", email = "hello@shipmindlabs.com" }]
keywords = ["payments", "gateway", "audit"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/shipmindlabs/payment-gateways"
Source = "https://github.com/shipmindlabs/payment-gateways"
Issues = "https://github.com/shipmindlabs/payment-gateways/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/payment_gateways"]

[tool.hatch.build.targets.sdist]
include = ["src", "README.md", "LICENSE"]
